<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Autenticación</title>
</head>
<body>
    <h2>Inicio de Sesión</h2>
    {% if error %}
        <p style="color: red;"><strong>Error:</strong> {{ error }}</p>
    {% endif %}

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label>Usuario:</label><br>
        <input type="text" id="username" name="username" required autocomplete="off"><br><br>
        
        <label>Contraseña:</label><br>
        <input type="password" id="password" name="password" required autocomplete="off"><br><br>
        
        <label>Código FreeOTP (6 dígitos):</label><br>
        <input type="text" id="totp" name="totp" pattern="[0-9]{6}" maxlength="6" required autocomplete="off" autofocus><br><br>
        
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
